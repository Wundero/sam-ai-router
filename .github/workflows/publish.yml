name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse version from commit message
        id: version
        run: |
          MSG="$(git log -1 --format=%s)"
          if ! echo "$MSG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Commit '$MSG' is not a vX.Y.Z release; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${MSG#v}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Check package.json version matches commit
        if: steps.version.outputs.publish == 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          COMMIT_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$COMMIT_VERSION" ]; then
            echo "::error::package.json version '$PKG_VERSION' does not match commit version '$COMMIT_VERSION'"
            exit 1
          fi
          echo "Publishing @wundero/ai-router@$PKG_VERSION"

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
